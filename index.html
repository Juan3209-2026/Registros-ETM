<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Registro ETM</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0b2545">
<link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>html,body{margin:0;height:100%;background:#0b2545;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
#ld{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;background:linear-gradient(135deg,#0b2545,#1f6feb);z-index:2;text-align:center;padding:20px}
#ld .i{font-size:64px}#ld a{display:none;color:#0b2545;background:#fff;border-radius:12px;padding:12px 20px;font-weight:700;text-decoration:none}</style>
<script src="config.js"></script></head><body>
<div id="ld"><div class="i">💧</div><div id="nm">Cargando…</div><a id="op" href="#">Abrir la aplicación directamente</a></div>
<iframe id="f" title="Aplicación" allow="clipboard-write"></iframe>
<script>
document.title=NOMBRE;document.getElementById('nm').textContent='Cargando '+NOMBRE+'…';
const f=document.getElementById('f'),ld=document.getElementById('ld'),op=document.getElementById('op');
if(APP_URL.indexOf('PEGA_AQUI')===0){document.getElementById('nm').textContent='Falta configurar la URL en config.js'}
else{op.href=APP_URL;f.src=APP_URL;f.onload=()=>{ld.style.display='none'};setTimeout(()=>{op.style.display='inline-block'},7000)}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
